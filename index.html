<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JR Games</title>
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&family=Nunito:wght@400;700;800&display=swap">
<style>
:root { --bg:#04349c; --ink:#ffffff; --muted:#c9d3f5; --gold:#ffd65a; --card:#0b2a78; --line:#2c4fae;
  --display:"Jersey 10",system-ui,sans-serif; --body:"Nunito","Segoe UI",system-ui,sans-serif; color-scheme: dark }
body { margin:0; background:var(--bg); color:var(--ink); font:400 16px/1.6 var(--body); }
main { max-width:720px; margin-inline:auto; padding-inline:16px; padding-block:40px 56px; display:grid; gap:28px; }
.logo { width:180px; max-width:60%; border-radius:10px; }
h1 { font:400 40px/1 var(--display); color:var(--gold); margin:0; }
.card { background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
.card img { display:block; width:100%; height:auto; }
.card div { padding:18px 20px 22px; display:grid; gap:8px; }
.card h2 { font:400 30px/1 var(--display); color:var(--gold); margin:0; }
.card p { margin:0; color:var(--muted); }
a { color:var(--gold); font-weight:700; }
a:focus-visible { outline:2px solid var(--gold); outline-offset:2px; }
.links { display:flex; flex-wrap:wrap; gap:16px; }
footer { color:var(--muted); font-size:13px; }
</style></head><body><main>
<img class="logo" src="jr_games.png" alt="JR Games">
<h1>Jogos para jogar em família</h1>
<section class="card">
  <img src="mishaq/destaque.png" alt="Mishaq — uma jornada bíblica">
  <div>
    <h2>Mishaq</h2>
    <p>Jogo de tabuleiro com perguntas da Bíblia, para 1 a 4 pessoas no mesmo celular, com modo Quiz e prendas. Gratuito, para todas as idades.</p>
    <p class="links"><a href="mishaq/privacidade.html">Política de Privacidade</a></p>
  </div>
</section>
<footer>© 2026 JR Games · Contato: ramon.oliveira08@gmail.com</footer>
</main></body></html>
